# Проверки кода. Запускаются на каждый pull request и вызываются деплоем как
# reusable-workflow: выкатка начинается только после того, как все пять job зелёные.
#
# Отдельной среды у проекта нет, разработка идёт сразу на боевом сервере, поэтому
# эти проверки — единственный рубеж между веткой и продом.
#
# Раннеры — GitHub, и на публичном репозитории они бесплатны и не кончаются.
# Метку задаёт переменная репозитория `RUNNER_LABEL` (по умолчанию `ubuntu-latest`).
#
# **Свой раннер здесь включать нельзя, пока репозиторий публичный** (09.09.2026):
# `pull_request` исполняет код из ЧУЖОЙ ветки, а раннер стоял бы на боевом VPS
# и состоял в группе `docker` — то есть чужой PR получал бы root на проде.
# Подробности и порядок, если репозиторий снова станет приватным, — docs/80-deploy.md §8.9.

name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# На pull request новый push отменяет предыдущий прогон, а вот вызов из деплоя
# отменять нельзя: за ним стоит уже начатая выкатка.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .

  types:
    name: mypy --strict
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy --strict

  tests:
    name: pytest
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Настоящая PostgreSQL, а не мок: тесты изоляции теннантов, синхронизации стадий
    # и вся цепочка миграций upgrade → downgrade → upgrade без неё молча пропускаются
    # (см. tests/conftest.py). Пропущенный тест изоляции нарушает docs/40-security.md §5.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          # Только на петлю. На раннере GitHub это ничего не меняет, а на своём —
          # спасает: docker публикует порты в обход iptables хоста, и без явного
          # адреса тестовая база с паролем postgres/postgres была бы видна
          # из интернета всё время прогона.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=junit.xml
      # Тесты на живой базе пропускают сами себя без TEST_DATABASE_URL:
      # опечатка в переменной дала бы зелёный CI без единой проверки изоляции.
      # Ищем по ПРИЧИНЕ пропуска, а не по именам модулей: список модулей пришлось
      # бы дописывать руками, и первый же забытый молча выпал бы из проверки.
      - name: тесты на живой базе не пропущены
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          live = []
          for c in ET.parse("junit.xml").getroot().iter("testcase"):
              skipped = c.find("skipped")
              if skipped is not None and "TEST_DATABASE_URL" in (skipped.get("message") or ""):
                  live.append(f"{c.get('classname', '')}::{c.get('name', '')}")
          if live:
              print("пропущены тесты на живой базе:", *live, sep="\n  ")
              sys.exit(1)
          print("тесты на живой базе отработали полностью")
          PY

  frontend:
    name: miniapp build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web/miniapp
      # build = tsc --noEmit && vite build. Отдельным job-ом, а не только внутри образа:
      # ошибка TypeScript видна через минуту, а не через пять.
      - run: npm run build
        working-directory: web/miniapp

  secrets:
    name: gitleaks
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # секрет ищется во всей истории, а не только в HEAD
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source=. --config=.gitleaks.toml --redact --no-banner --verbose

  image:
    name: docker build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # На push в main образ собирает и публикует deploy.yml — здесь только проверка,
    # что Dockerfile жив. Кеш общий, так что сборка при выкатке переиспользует слои.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
