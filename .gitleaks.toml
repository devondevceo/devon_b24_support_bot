# Поиск секретов в коде и во всей истории git (инвариант И-7).
# Запускается в CI: .github/workflows/ci.yml, job `secrets`.
#
# Локально:
#   docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
#     detect --source=. --config=.gitleaks.toml --redact --verbose

[extend]
useDefault = true

[allowlist]
description = "Синтетика тестов и заготовки конфигов"

paths = [
  # Шаблон .env: все значения пустые, заполняется на сервере руками.
  '''\.env\.example$''',
]

# Разрешение по ЗНАЧЕНИЮ, а не по пути. Каталог tests/ целиком в allowlist не идёт:
# боевой токен бота и боевой client_secret однажды уже лежали в
# tests/test_log_scrubber.py как «настоящая форма» и чуть не уехали в GitHub.
# Новый синтетический токен придётся дописать сюда руками — эта заминка и есть
# то место, где человек ещё раз смотрит, точно ли значение выдуманное.
regexes = [
  '''123456789:AAHfake-token-for-tests-only-0000000''',
  '''987654321:BBanother-token-for-tests-000000000''',
  '''1234567890:AAHnQwErTyUiOpAsDfGhJkLzXcVbNm12345''',
  '''123456789:AAHverylongtokenvaluewith30plus''',
  # Ключ шифрования тестов: 32 байта из строки "0123456789abcdef"×2 в base64url.
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY''',
  # Тот же ключ в РАСКОДИРОВАННОМ виде. gitleaks сам декодирует base64 (в находке
  # это видно по тегу `decoded:base64`) и сверяет allowlist с тем, что получилось,
  # поэтому разрешения одной закодированной формы не хватает — прогон падал ровно
  # на этом, при том что закодированная строка в списке уже стояла.
  '''0123456789abcdef0123456789abcdef''',
  # Синтетический OAuth-токен в тесте скраббера: проверяется, что он НЕ попадёт
  # в лог. Значение выдуманное, длина взята из формы настоящего.
  '''abc123def456ghi789''',
]
